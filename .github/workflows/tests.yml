name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22', '24']
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
      - name: Check package contents
        run: npm pack --dry-run

  required-tests:
    name: Package tests
    needs: [node]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test matrix
        run: test '${{ needs.node.result }}' = 'success'
